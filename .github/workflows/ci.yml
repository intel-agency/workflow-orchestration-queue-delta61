# CI/CD workflow for workflow-orchestration-queue
# All actions are pinned to full commit SHA for supply chain security

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163cece73e30997d3003a4e5e9 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b811ed03168c5cf377e876c775cb9d1c5f1 # v5.4.0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run Ruff linter
        run: ruff check src tests

      - name: Run Ruff formatter check
        run: ruff format --check src tests

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163cece73e30997d3003a4e5e9 # v4.2.2

      - name: Install uv
        uses: astral-sh/setup-uv@0c5e2b811ed03168c5cf377e876c775cb9d1c5f1 # v5.4.0

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c5cf377e876c775cb9d1c5f55 # v5.5.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run tests with coverage
        run: pytest --cov=src --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f0618c74b # v5.4.0
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163cece73e30997d3003a4e5e9 # v4.2.2

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          scan-type: "fs"
          scan-ref: "."
          severity: "CRITICAL,HIGH"
          format: "sarif"
          output: "trivy-results.sarif"

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@f079b8493333aace61c81488f8bd40919487bd9f # v3.28.17
        with:
          sarif_file: "trivy-results.sarif"

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, scan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b163cece73e30997d3003a4e5e9 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image
        uses: docker/build-push-action@471d1dc4e077523904f01b93a803d96791a3347b # v6.15.0
        with:
          context: .
          push: false
          tags: workflow-orchestration-queue:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
